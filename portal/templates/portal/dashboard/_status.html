<div class="card h-100 border-0 shadow-sm">
  <div class="card-body">
    <h2 class="card-title mb-3">Atenciones por estado</h2>
    {% for bar in summary.bars %}
    <div class="mb-3">
      <div class="d-flex justify-content-between small"><span>{{ bar.label }}</span><span class="fw-semibold">{{ bar.value }} · {{ bar.pct }}%</span></div>
      <div class="progress" role="progressbar" aria-label="{{ bar.label }}" aria-valuenow="{{ bar.pct }}" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-bar bg-{{ bar.tone }}" style="width: {{ bar.pct }}%"></div>
      </div>
    </div>
    {% endfor %}
    <p class="small text-body-secondary mb-0">Tasa de resolución: <strong>{{ summary.resolved_pct }}%</strong> de {{ summary.total }} atenciones.</p>
  </div>
</div>
