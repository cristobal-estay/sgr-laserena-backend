# Nginx para el SGR en la EC2 (plantilla). deploy/instalar_ec2.sh la copia a
# /etc/nginx/sites-available/sgr completando la ruta del proyecto y, si se
# instala phpMyAdmin, su bloque de configuración.
#
# - Puerto 80 -> Gunicorn en 127.0.0.1:8000 (Django).
# - /media/ (archivos subidos: imágenes y adjuntos de atenciones) lo sirve Nginx.
# - /static/ lo sirve WhiteNoise desde Django (no hace falta configurarlo aquí).
# - /phpmyadmin/ solo si se instaló phpMyAdmin.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Imágenes (2 MB) y documentos (5 MB) de las atenciones.
    client_max_body_size 10M;

    location /media/ {
        alias __PROJECT_DIR__/media/;
    }

__PHPMYADMIN__

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
